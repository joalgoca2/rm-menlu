services:
  app:
    build:
      context: ./services/app
      dockerfile: Dockerfile
      target: deps
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      - EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST}
      - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT}
      - EMAIL_SERVER_USER=${EMAIL_SERVER_USER}
      - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - NEXT_PUBLIC_APP_VERSION=${PROD_DEPLOY_TAG}
      - NEXT_PUBLIC_ENABLE_INTEGRATIONS=${NEXT_PUBLIC_ENABLE_INTEGRATIONS}
      - NEXT_PUBLIC_ENABLE_BILLING=${NEXT_PUBLIC_ENABLE_BILLING}
      - NEXT_PUBLIC_ENABLE_PWA=${NEXT_PUBLIC_ENABLE_PWA}
      - NEXT_PUBLIC_ENABLE_WALKTHROUGH=${NEXT_PUBLIC_ENABLE_WALKTHROUGH}
      - NEXT_PUBLIC_ENABLE_SCREEN_LOCK=${NEXT_PUBLIC_ENABLE_SCREEN_LOCK}
      - NEXT_PUBLIC_ENABLE_OFFLINE=${NEXT_PUBLIC_ENABLE_OFFLINE}
      - NEXT_PUBLIC_ENABLE_AI_CHAT=${NEXT_PUBLIC_ENABLE_AI_CHAT}
      - AI_PROVIDER=${AI_PROVIDER}
      - AI_API_KEY=${AI_API_KEY}
      - CLIP_PUBLIC_KEY=${CLIP_PUBLIC_KEY}
      - PAYMENT_PROVIDERS=${PAYMENT_PROVIDERS}
      - CLIP_SECRET_KEY=${CLIP_SECRET_KEY}
      - CLIP_WEBHOOK_SECRET=${CLIP_WEBHOOK_SECRET}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET}
      - PSE_SECRET_KEY=${PSE_SECRET_KEY}
      - PSE_WEBHOOK_SECRET=${PSE_WEBHOOK_SECRET}
    networks:
      - rm_monkeycore_network

networks:
  rm_monkeycore_network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-rm_monkeycore_network}
