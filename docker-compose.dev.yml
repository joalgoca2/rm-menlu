services:
  app:
    container_name: rm-menlu-app
    user: "root"
    ports:
      - "${APP_PORT:-3013}:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=true
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST}
      - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT}
      - EMAIL_SERVER_USER=${EMAIL_SERVER_USER}
      - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - NEXT_PUBLIC_ENABLE_INTEGRATIONS=${NEXT_PUBLIC_ENABLE_INTEGRATIONS:-true}
      - NEXT_PUBLIC_APP_VERSION=${PROD_DEPLOY_TAG:-1.0.1}
      - N8N_BILLING_URL=${N8N_BILLING_URL}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-mock}
      - ENABLE_BILLING_NOTIFICATIONS=${ENABLE_BILLING_NOTIFICATIONS:-true}
      - NEXT_PUBLIC_ENABLE_AI_CHAT=${NEXT_PUBLIC_ENABLE_AI_CHAT:-true}
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - AI_API_KEY=${AI_API_KEY}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - dev_app_vol:/app
      - /app/.next
      - ./services/app/public/uploads:/app/public/uploads
    command: sh -c "npm install && npx prisma generate && npm run dev"
    networks:
      - dev-network

networks:
  dev-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-dev-network}

volumes:
  dev_app_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/services/app
